name: Windows 실행 파일
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TOMO_MICROSOFT_CLIENT_ID: ${{ vars.TOMO_MICROSOFT_CLIENT_ID }}
      VITE_TOMO_GOOGLE_CLIENT_ID: ${{ vars.VITE_TOMO_GOOGLE_CLIENT_ID }}
      VITE_TOMO_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_TOMO_GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile
      - run: yarn test:run
      - run: yarn prebuild
      - run: yarn electron-builder --win nsis portable --x64 --publish never
      - name: 실행 파일 보관
        uses: actions/upload-artifact@v7
        with:
          name: TOMO-CALENDAR-Windows-x64
          path: release/TOMO*.exe
          compression-level: 0
          if-no-files-found: error
      - name: 게시된 릴리즈에 실행 파일 추가
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: pwsh
        run: |
          $tomoAssets = Get-ChildItem -LiteralPath release -Filter 'TOMO*.exe' | ForEach-Object { $_.FullName }
          gh release upload $env:RELEASE_TAG @tomoAssets
